name: Release

on:
  push:
    tags: ['v*']

# No default permissions: each job gets only what it needs, so the job that installs and runs npm dependencies can't publish.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Install scripts never run: only code the test and build tools actually load runs here.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Build the bundle before publishing, so a bundle failure can't leave an npm version without a release.
      - run: npm run build:mcpb
      # Packing a tarball drops the commit npm records as gitHead; stamp it so npm keeps linking the version to its commit.
      - run: npm pkg set gitHead="$GITHUB_SHA"
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            ripio-community-mcp-*.tgz
            ripio-community-mcp.mcpb
          if-no-files-found: error
          retention-days: 7

  # Publishes exactly what build produced. It installs nothing and runs no package scripts, so no npm dependency ever
  # runs with the npm publishing token. npm is skipped only when it already has this version from this commit, and the
  # Release only when it is already published with the bundle, so a re-run finishes the rest.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # npm accepts this package only from this environment, and GitHub lets only v* tags use it.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      # Only for server.json, which the MCP Registry publish reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Outside the checkout, so nothing in the artifact can stand in for server.json or an .npmrc.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Check the release files are there before anything is published
        run: |
          test -f "${RUNNER_TEMP}/release/ripio-community-mcp-${GITHUB_REF_NAME#v}.tgz"
          test -f "${RUNNER_TEMP}/release/ripio-community-mcp.mcpb"
      # npm trusted publishing (OIDC, no token) needs npm >= 11.5.1, which ships with Node 24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm --version
      # A packed tarball publishes without running any package script. Verbose output shows why an OIDC token exchange fails.
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if published=$(npm view "ripio-community-mcp@${version}" gitHead --prefer-online 2> /dev/null); then
            if [ "$published" != "$GITHUB_SHA" ]; then
              echo "::error::ripio-community-mcp@${version} is already on npm from ${published:-an unrecorded commit}, not ${GITHUB_SHA}. Publish a new version instead of re-tagging."
              exit 1
            fi
            echo "::notice::ripio-community-mcp@${version} is already on npm from this commit; skipping."
          else
            npm publish "${RUNNER_TEMP}/release/ripio-community-mcp-${version}.tgz" --provenance --access public
          fi
        env:
          NPM_CONFIG_LOGLEVEL: verbose
      - name: Create the GitHub Release
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            ready=$(gh release view "${GITHUB_REF_NAME}" --json isDraft,assets --jq '(.isDraft | not) and any(.assets[]; .name == "ripio-community-mcp.mcpb")')
            if [ "$ready" != "true" ]; then
              echo "::error::Release ${GITHUB_REF_NAME} exists but is a draft or lacks ripio-community-mcp.mcpb; fix it by hand, then re-run."
              exit 1
            fi
            echo "::notice::Release ${GITHUB_REF_NAME} already exists with the bundle; skipping."
          else
            gh release create "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release/ripio-community-mcp.mcpb" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # The MCP Registry checks mcpName against npm, so wait until the new version is visible there.
      - name: Wait for the npm release to be visible
        run: |
          for i in $(seq 1 30); do
            npm view "ripio-community-mcp@${GITHUB_REF_NAME#v}" version --prefer-online && exit 0
            sleep 10
          done
          exit 1
      # Pinned mcp-publisher, verified against the registry's published checksum; logs in with OIDC (no token).
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
